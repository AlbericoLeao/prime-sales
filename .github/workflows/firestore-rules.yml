name: Firestore rules tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches:
      - main
      - 'fix/production-readiness-firestore-hosting'

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore rules emulator tests
        run: npm run test:rules
