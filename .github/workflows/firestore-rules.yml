name: Firestore rules tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'app/**'
      - 'functions/**'
      - 'firebase.json'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches:
      - main
      - 'fix/production-readiness-firestore-hosting'
      - 'security/seller-account-provisioning-audit'

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check functions/index.js && node --check functions/order-domain.js && node --check app/app.js && node --check app/firebase-service.js
      - name: Run server-side order validation unit tests
        run: npm run test:functions
      - name: Run Firestore rules emulator tests
        run: npm run test:rules
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
